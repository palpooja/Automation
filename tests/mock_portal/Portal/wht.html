<html><body><div id="GenTaxCreditCert"><table><tr><td>From</td><td><input id="frmDt" readonly onblur="getToDate(this)">
<img title="Date Selector" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="16" height="16" onclick="openCal()"></td></tr>
<tr><td>To</td><td><input id="toDt" readonly></td></tr>
<tr><td>For</td><td><select id="generateFor"><option value="D">Payee</option><option value="P">Payer</option></select></td></tr>
<tr class="tdbar"><td><input type="button" value="Search" onclick="doSearch()"></td></tr></table>
<div id="cal" style="display:none;position:absolute;top:40px;left:300px;background:#eee"></div>
<div id="proc" style="display:none">Please wait as we process your request</div><div id="res"></div></div>
<script>
var M=['January','February','March','April','May','June','July','August','September','October','November','December'];
var cy=2026, cm=9;  // calendar opens on October 2026, like 'today'
function pad(n){return (n<10?'0':'')+n}
function getToDate(el){var p=el.value.split('/'); if(p.length<3)return; var last=new Date(+p[2],+p[1],0).getDate(); document.getElementById('toDt').value=last+'/'+p[1]+'/'+p[2];}
function drawCal(){var c=document.getElementById('cal');
  var h='<table><thead><tr><td onclick="cy--;drawCal()">&laquo;</td><td onclick="cm--;if(cm<0){cm=11;cy--};drawCal()">&lsaquo;</td><td>'+M[cm]+' '+cy+'</td><td onclick="cm++;if(cm>11){cm=0;cy++};drawCal()">&rsaquo;</td><td onclick="cy++;drawCal()">&raquo;</td></tr></thead><tbody><tr>';
  var first=new Date(cy,cm,1).getDay(); for(var i=0;i<first;i++) h+='<td class="other">'+(28+i)+'</td>';
  for(var d=1;d<=new Date(cy,cm+1,0).getDate();d++){h+='<td onclick="pick('+d+')">'+d+'</td>'; if((first+d)%7==0) h+='</tr><tr>';}
  c.innerHTML=h+'</tr></tbody></table>';}
function openCal(){document.getElementById('cal').style.display='block';drawCal();}
function pick(d){document.getElementById('frmDt').value=pad(d)+'/'+pad(cm+1)+'/'+cy;document.getElementById('cal').style.display='none';}
function doSearch(){var p=document.getElementById('proc'); p.style.display='block';
  setTimeout(function(){p.style.display='none';},300);
  setTimeout(function(){ var gf=document.getElementById('generateFor').value; var to=document.getElementById('toDt').value.split('/'); var per=to[1]+'/'+to[2];
    var n=(gf=='D')?({'06/2026':2,'07/2026':0}[per]):({'06/2026':1,'07/2026':4}[per]); if(n===undefined) n=1;
    if(!n){document.getElementById('res').innerHTML='No records found';return;}
    var h='<table class="FORM_TAB_BORDER"><tr><th>Select All</th><th>Sl. No.</th><th>Agent TIN</th><th>Agent Name</th><th>Period</th><th>Gross Amount</th><th>Tax Withheld</th><th>TCC No</th></tr>';
    for(var i=1;i<=n;i++) h+='<tr><td><input type=checkbox></td><td>'+i+'</td><td>10000257'+i+'0</td><td>'+(gf=='D'?'Agent ':'Supplier ')+i+'</td><td>'+per+'</td><td>1,000,000.00</td><td>60,000.00</td><td></td></tr>';
    document.getElementById('res').innerHTML=h+'</table>';},900);}
</script></body></html>
